<aside
  class="cart-drawer"
  id="cart-drawer"
  aria-label="Carrito de compra"
  aria-hidden="true"
>
  <div class="drawer-head">
    <div>
      <p class="eyebrow">Tu selección</p>
      <h2>Carrito</h2>
    </div>
    <button
      class="icon-button"
      type="button"
      data-action="close-cart"
      aria-label="Cerrar carrito"
    >
      ×
    </button>
  </div>

  <div class="cart-items" id="cart-items"></div>
  <div class="cart-summary" id="cart-summary"></div>

  <div class="drawer-actions">
    <button
      class="button button-dark button-block"
      type="button"
      data-action="start-checkout"
    >
      Continuar al checkout <span>→</span>
    </button>
    <button class="text-button" type="button" data-action="close-cart">
      Seguir explorando
    </button>
  </div>
</aside>

<div class="overlay" data-action="close-overlays" hidden></div>

<section class="support-section section-shell" aria-labelledby="support-title">
  <div><p class="eyebrow">¿Ha surgido algo?</p><h2 id="support-title">Atención para<br><em>partidas con historia.</em></h2></div>
  <form class="support-form" id="support-form" novalidate>
    <label>Correo de prueba<input name="supportEmail" type="email" placeholder="jugador@ejemplo.es" required></label>
    <label>Cuéntanos la incidencia<textarea name="supportMessage" rows="3" minlength="10" maxlength="5000" placeholder="Ej.: Necesito información sobre un pedido de prueba." required></textarea></label>
    <div class="support-honeypot" aria-hidden="true"><label>Deja este campo vacío<input name="website" type="text" tabindex="-1" autocomplete="off"></label></div>
    <p class="support-feedback" id="support-feedback" role="status" aria-live="polite"></p>
    <button class="button button-primary" type="submit">Enviar solicitud <span>→</span></button>
  </form>
</section>

<section class="support-section section-shell" id="soporte" aria-labelledby="support-title">
  <div>
    <p class="eyebrow">Soporte</p>
    <h2 id="support-title">¿Tienes una incidencia?</h2>
    <p class="support-intro">Registra una solicitud desde tu cuenta. Quedará vinculada al usuario en la base de datos.</p>
  </div>
  <form class="support-form" id="support-form" novalidate>
    <label>Asunto<input name="supportSubject" required minlength="3" maxlength="150" placeholder="Consulta sobre mi pedido"></label>
    <label>Descripción<textarea name="supportMessage" rows="3" required minlength="10" maxlength="5000" placeholder="Describe la incidencia..."></textarea></label>
    <div class="support-honeypot" aria-hidden="true"><label>Deja este campo vacío<input name="website" type="text" tabindex="-1" autocomplete="off"></label></div>
    <p class="support-feedback" id="support-feedback" role="status" aria-live="polite"></p>
    <button class="button button-primary" type="submit">Enviar incidencia <span>→</span></button>
  </form>
</section>

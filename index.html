<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PlanetaFicha, prototipo académico de eCommerce de juegos de mesa y puzzles de importación.">
  <title>PlanetaFicha - Juegos de importación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="./styles.css?v=20261005-9">
</head>
<body>
  <div data-component="./components/header.html"></div>
  <main>
    <div data-component="./components/hero.html"></div>
    <div data-component="./components/trust.html"></div>
    <div data-component="./components/catalog.html"></div>
    <div data-component="./components/experience.html"></div>
    <div data-component="./components/traceability.html"></div>
    <div data-component="./components/support.html"></div>
  </main>
  <div data-component="./components/footer.html"></div>
  <div data-component="./components/cart.html"></div>
  <div data-component="./components/dialogs.html"></div>

  <!-- La página usa componentes HTML y scripts secuenciales. Debe ejecutarse desde HTTP(S). -->
  <script>
    const ASSET_VERSION = "20261005-9";

    async function loadComponent(container) {
      const path = container.dataset.component;
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`No se pudo cargar ${path}: HTTP ${response.status}`);
      }
      container.outerHTML = await response.text();
    }

    function loadScript(path) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = `${path}?v=${ASSET_VERSION}`;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`No se pudo cargar ${path}`));
        (document.body || document.documentElement).appendChild(script);
      });
    }

    function showBootError(error) {
      console.error("No se pudo iniciar PlanetaFicha:", error);
      const message = document.createElement("p");
      message.setAttribute("role", "alert");
      message.textContent = `No se ha podido iniciar PlanetaFicha: ${error.message}.`;
      Object.assign(message.style, {
        maxWidth: "700px",
        margin: "40px auto",
        padding: "20px",
        background: "#ed7658",
        color: "#17201e",
        fontFamily: "sans-serif"
      });
      (document.body || document.documentElement).appendChild(message);
    }

    async function initializeApplication() {
      try {
        const containers = [...document.querySelectorAll("[data-component]")];
        await Promise.all(containers.map(loadComponent));

        await loadScript("./js/i18n.js");
        await loadScript("./js/data/products.js");
        await loadScript("./js/utils.js");
        await loadScript("./js/auth.js");
        await authReady;
        try {
          await loadProductsFromApi();
        } catch (error) {
          console.warn("API de productos no disponible. Se usará el catálogo visual incluido para esta ejecución.", error);
          useStaticProductFallback();
        }
        await loadScript("./js/events.js");
        await loadScript("./js/catalog.js");
        await loadScript("./js/cart.js");
        await loadScript("./js/checkout.js");
        await loadScript("./js/support.js");
        await loadScript("./js/admin.js");
        await loadScript("./app.js");
      } catch (error) {
        showBootError(error);
      }
    }

    initializeApplication();
  </script>
</body>
</html>
